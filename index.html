<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Birthday Baba ❤️</title>
<style>
:root{--gold:#ffd27a;--rose:#ff5d8f;--ink:#080515}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Georgia,'Times New Roman',serif;color:#fff}
canvas{display:block;touch-action:none}
#intro{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;background:radial-gradient(circle at 50% 40%,#2b1450,#080515 70%);padding:20px}
#intro h1{font-size:clamp(34px,8vw,76px);margin:0;font-weight:400;background:linear-gradient(90deg,#ffd27a,#ff5d8f,#ffd27a);-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px #ff5d8f55}
#intro p{margin:0;opacity:.8;font-style:italic}
button{font:inherit;cursor:pointer;border:0;border-radius:40px;padding:14px 34px;font-size:18px;color:#2a0a1f;background:linear-gradient(135deg,#ffd27a,#ff8fb1);box-shadow:0 0 30px #ff5d8f66;transition:transform .2s}
button:hover{transform:scale(1.07)}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;padding:14px 18px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 2px 8px #000}
#hud b{font-weight:400;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);z-index:6;background:#150a2acc;border:1px solid #ffd27a66;padding:12px 22px;border-radius:30px;opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;max-width:90vw}
#modal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:#05030ecc;backdrop-filter:blur(6px);padding:16px}
#modal.on{display:flex}
.card{background:#fffaf0;color:#33202a;padding:14px 14px 18px;border-radius:6px;max-width:min(92vw,440px);max-height:92vh;overflow:auto;text-align:center;box-shadow:0 20px 80px #000;transform:rotate(-2deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.card img{width:100%;max-height:62vh;object-fit:contain;background:#eee;display:block}
.card p{margin:12px 6px 0;font-size:19px;line-height:1.45}
.card.letter{transform:none;padding:26px;background:#fff4e0}
.card button{margin-top:14px;padding:10px 26px;font-size:16px}
@keyframes pop{from{transform:scale(.2) rotate(12deg);opacity:0}}
body:after{content:'';position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(circle,transparent 55%,#0009)}#sur{position:fixed;right:16px;bottom:16px;z-index:6;padding:10px 20px;font-size:15px}#dock{position:fixed;left:12px;bottom:16px;z-index:6;display:flex;gap:8px}#dock button{padding:10px 14px;font-size:14px}#zoom{position:fixed;right:16px;bottom:70px;z-index:6;display:flex;flex-direction:column;gap:8px}#zoom button{width:46px;height:46px;padding:0;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center}#dock{flex-wrap:wrap;max-width:60vw}</style></head><body>
